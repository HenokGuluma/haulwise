# Nginx reverse proxy -> the app on 127.0.0.1:3000.
#
# coberfreight.com.et is the domain registered through Ethio Telecom.
# dispatch.coberfreight.com.et is the subdomain designated for this app
# specifically, leaving the bare root domain free for something else later
# (a company site, other subdomains, etc.) without any conflict — nginx
# server blocks are matched by hostname, so adding another subdomain here
# later is just another name in server_name plus its own cert.
# coberbusiness.org is also listed in case its DNS (currently proxied
# through Cloudflare) ever gets pointed here directly — it doesn't have its
# own certificate yet, so it's deliberately left out of the HTTPS/redirect
# handling below until it does.
#
# Ethio Telecom has since forwarded standard ports 80/443 to this server
# (previously only 12080/12443 worked) — both still work in parallel, but
# 80/443 are now the primary/expected path, so HTTP->HTTPS redirect is back
# on for the domains with a real certificate.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/coberfreight
#   sudo ln -s /etc/nginx/sites-available/coberfreight /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d coberfreight.com.et -d www.coberfreight.com.et -d dispatch.coberfreight.com.et
server {
    listen 80;
    listen [::]:80;
    server_name coberfreight.com.et www.coberfreight.com.et dispatch.coberfreight.com.et coberbusiness.org www.coberbusiness.org;

    # Allow document uploads (the app caps files at 15MB).
    client_max_body_size 20m;

    # `if` at the server level (not nested inside location /) — nginx's `if`
    # directive is unreliable when combined with other directives inside a
    # location block (a well-documented nginx gotcha, and what broke
    # certbot's ACME HTTP-01 self-test here the first time). This is the
    # same pattern certbot's own --nginx plugin generates. coberbusiness.org
    # has no certificate yet, so it's deliberately not in this list — it
    # falls through to location / and stays on plain HTTP.
    if ($host = coberfreight.com.et) { return 301 https://$host$request_uri; }
    if ($host = www.coberfreight.com.et) { return 301 https://$host$request_uri; }
    if ($host = dispatch.coberfreight.com.et) { return 301 https://$host$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coberfreight.com.et www.coberfreight.com.et dispatch.coberfreight.com.et coberbusiness.org www.coberbusiness.org;

    client_max_body_size 20m;

    # Covers coberfreight.com.et, www, and dispatch — coberbusiness.org has
    # no cert of its own, so a browser hitting this block with that Host
    # header will see a certificate-name mismatch warning until it does.
    ssl_certificate /etc/letsencrypt/live/coberfreight.com.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coberfreight.com.et/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

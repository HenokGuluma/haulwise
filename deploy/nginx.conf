# Nginx reverse proxy -> the app on 127.0.0.1:3000.
#
# coberfreight.com.et is the domain actually registered through Ethio Telecom
# and DNS-resolves straight to this server (no proxy in front of it), so it's
# the primary one. coberbusiness.org is also listed in case its DNS (currently
# proxied through Cloudflare, which blocks our non-standard ports) ever gets
# switched to point here directly.
#
# Both HTTP (80) and HTTPS (443) are served, but deliberately WITHOUT an
# HTTP->HTTPS redirect. That's the opposite of normal practice, but this
# server sits behind a shared IP whose only externally-reachable ports are
# 12080 (-> this 80 block) and 12443 (-> this 443 block) — there is no
# reachable standard port 443, so a redirect to "https://coberfreight.com.et/"
# (implicit port 443) would point visitors at an address that doesn't
# resolve, breaking the plain-HTTP access that currently works. Once Ethio
# Telecom provisions a dedicated IP with real standard ports, add back:
#   if ($host = coberfreight.com.et) { return 301 https://$host$request_uri; }
#   if ($host = www.coberfreight.com.et) { return 301 https://$host$request_uri; }
# in the port-80 block below (or just re-run `certbot --nginx`, which offers
# to do this automatically and did so unprompted last time).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/coberfreight
#   sudo ln -s /etc/nginx/sites-available/coberfreight /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS cert (already issued for coberfreight.com.et/www via DNS-01, since
# HTTP-01 needs a reachable standard port 80 which we don't have):
#   sudo certbot certificates   # shows the existing cert
server {
    listen 80;
    listen [::]:80;
    server_name coberfreight.com.et www.coberfreight.com.et coberbusiness.org www.coberbusiness.org;

    # Allow document uploads (the app caps files at 15MB).
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coberfreight.com.et www.coberfreight.com.et coberbusiness.org www.coberbusiness.org;

    client_max_body_size 20m;

    # Only covers coberfreight.com.et/www — coberbusiness.org has no cert of
    # its own yet, so a browser hitting this block with that Host header will
    # see a certificate-name mismatch warning until/unless that's issued too.
    ssl_certificate /etc/letsencrypt/live/coberfreight.com.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coberfreight.com.et/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

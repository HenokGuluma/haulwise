# Nginx reverse proxy for coberbusiness.org -> the app on 127.0.0.1:3000.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/coberbusiness.org
#   sudo ln -s /etc/nginx/sites-available/coberbusiness.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d coberbusiness.org -d www.coberbusiness.org
#
# certbot rewrites this to add the HTTPS (443) server block and an HTTP->HTTPS
# redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name coberbusiness.org www.coberbusiness.org;

    # Allow document uploads (the app caps files at 15MB).
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

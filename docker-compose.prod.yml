# Production stack for a single Linux VPS (e.g. Ethio Telecom): the Next.js app
# and PostgreSQL, both hosted locally on the same machine. Bring it up with:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets are read from a .env file in this directory — copy
# deploy/env.production.example to ./.env and fill it in first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      STORAGE_DRIVER: local
      NODE_ENV: production
    volumes:
      # Uploaded documents (BOL/POD/etc.) persist here across restarts.
      - uploads:/app/uploads
    # Bound to localhost only — the host's Nginx terminates TLS and proxies in.
    ports:
      - "127.0.0.1:3000:3000"
    # Apply any pending DB migrations, then start the server.
    command: sh -c "npx prisma migrate deploy && npm run start"

volumes:
  db_data:
  uploads:
